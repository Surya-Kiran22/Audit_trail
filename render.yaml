# Render Infrastructure-as-Code Blueprint Spec
# Single Web Service deployment for Audit Trail (Frontend + Backend unified)

services:
  - type: web
    name: audit-trail
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
        comment: "Provide your MongoDB connection string (e.g. MongoDB Atlas URI)"
      - key: VITE_API_BASE
        value: /api
